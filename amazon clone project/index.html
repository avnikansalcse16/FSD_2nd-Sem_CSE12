<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Clone</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->

    <nav class="navbar">

        <div class="logo">
            amazon
        </div>

        <div class="search-bar">

            <input
                type="text"
                id="searchInput"
                placeholder="Search products"
                onkeyup="searchProduct()"
            >

        </div>

        <div class="cart-icon">
            Cart:
            <span id="cartCount">0</span>
        </div>

    </nav>

    <!-- Hero Section -->

    <div class="hero">
        <h1>Welcome to Amazon Clone</h1>
    </div>

    <!-- Product Section -->

    <div class="products" id="productList">

        <div class="card">

            <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500">

            <h3>Smartphone</h3>

            <p>₹25000</p>

            <button onclick="addToCart('Smartphone',25000)">
                Add to Cart
            </button>

        </div>

        <div class="card">

            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500">

            <h3>Watch</h3>

            <p>₹3000</p>

            <button onclick="addToCart('Watch',3000)">
                Add to Cart
            </button>

        </div>

        <div class="card">

            <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500">

            <h3>Headphones</h3>

            <p>₹2500</p>

            <button onclick="addToCart('Headphones',2500)">
                Add to Cart
            </button>

        </div>

        <div class="card">

            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500">

            <h3>Shoes</h3>

            <p>₹4500</p>

            <button onclick="addToCart('Shoes',4500)">
                Add to Cart
            </button>

        </div>

    </div>

    <!-- Cart Section -->

    <div class="cart-section">

        <h2>Shopping Cart</h2>

        <ul id="cartItems"></ul>

        <h3>
            Total Price:
            ₹<span id="totalPrice">0</span>
        </h3>

        <button class="clear-btn" onclick="clearCart()">
            Empty Cart
        </button>

    </div>

    <script src="script.js"></script>

</body>
</html>
